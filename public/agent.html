<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <title>Espace Agent</title>
</head>
<body>
    <header> 
        <a href="/auth/profil">Gérer mon profil</a>
        <a href="/auth/logout">Se déconnecter</a>
    </header>
    <h1>Bienvenue dans le panneau d'Agent</h1>
    <button id="films" class="gros" type="button">Gérer les films</button>
    <button id="salles" class="gros" type="button">Gérer les salles</button>
    <button id="seances" class="gros" type="button">Gérer les séances</button>
    <button id="reservations" class="gros" type="button">Gérer les réservations</button>
    <script>
        const films = document.getElementById("films");
        const salles = document.getElementById("salles");
        const seances = document.getElementById("seances");
        const reservations = document.getElementById("reservations");

        films.addEventListener("click", () => {
            location.href = "/films";
        });
        
        salles.addEventListener("click", () => {
            location.href = "/salles";
        });
        
        seances.addEventListener("click", () => {
            location.href = "/seances";
        });

        reservations.addEventListener("click", () => {
            location.href = "/reservations";
        });
    </script>
</body>
</html>
