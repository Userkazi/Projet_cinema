<!DOCTYPE html>
    <html lang="fr">
        <head>
            <meta charset="UTF-8">
            <link rel="stylesheet" href="../style.css">
            <title>Modification de compte</title>
        </head>
        <body>
            <h1>Modification de compte</h1>
            <form id="modifierUnCompte">
                <label for="nom">NOm</label><br>
                <input id="nom" name="nom" type="text" disabled required><br><br>
                <label for="email">Adresse courriel</label><br>
                <input id="email" name="email" type="email" disabled required><br><br>
                <label for="password">Mot de passe</label><br>
                <input id="password" name="mot_de_passe" type="password" disabled required><br><br>
                <input id="retour" type="button" value="Retour">
                <input type="submit" value="Enregistrer">
            </form>
            <p id="msg"></p>
        </body>
        <script src="modifier.js"></script>
    </html>
