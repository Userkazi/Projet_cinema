<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
	<link rel="stylesheet" href="cinema.css">
    <title>Catalogue de films</title>
</head>
<body>

<h1>Catalogue de films</h1>

<input id="titre" placeholder="Titre"><br><br>
<input id="resume" placeholder="Résumé"><br><br>
<input id="duree" placeholder="Durée"><br><br>

<button id="ajouter">Ajouter</button>
<button id="afficher">Afficher</button>

<div id="liste"></div>

<script>
document.getElementById("ajouter").addEventListener("click", ajouterFilm);
document.getElementById("afficher").addEventListener("click", chargerFilms);

function chargerFilms() {
    fetch("/films")
        .then(res => res.json())
        .then(films => {
            let html = "<table border='1'>";
            html += "<tr><th>Titre</th><th>Résumé</th><th>Durée</th><th>Action</th></tr>";

            films.forEach(f => {
                html += `
                <tr>
                    <td>${f.titre}</td>
                    <td>${f.resume}</td>
                    <td>${f.duree}</td>
                    <td><button onclick="supprimerFilm(${f.id})">X</button></td>
                </tr>`;
            });

            html += "</table>";
            document.getElementById("liste").innerHTML = html;
        })
        .catch(err => console.log(err));
}

function ajouterFilm() {
    const titre = document.getElementById("titre").value;
    const resume = document.getElementById("resume").value;
    const duree = document.getElementById("duree").value;

    fetch("/films", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            titre: titre,
            resume: resume,
            duree: duree
        })
    })
    .then(res => res.text())
    .then(data => {
        console.log(data);
        chargerFilms();
    })
    .catch(err => console.log(err));
}

function supprimerFilm(id) {
    fetch("/films/" + id, {
        method: "DELETE"
    })
    .then(() => chargerFilms())
    .catch(err => console.log(err));
}
</script>

</body>
</html>
