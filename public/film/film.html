<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cinema.css">
    <title>Gestion des films</title>
</head>
<body>

<h1>Gestion des films</h1>

<form id="creerFilm">
    <label for="titre">Titre</label><br>
    <input id="titre" name="titre" type="text"><br><br>

    <label for="resume">Résumé</label><br>
    <input id="resume" name="resume" type="text"><br><br>

    <label for="duree">Durée</label><br>
    <input id="duree" name="duree" type="text"><br><br>

    <label for="affiche_url">URL de l'affiche</label><br>
    <input id="affiche_url" name="affiche_url" type="text"><br><br>

    <label for="id_categorie">Catégorie</label><br>
    <select id="id_categorie" name="id_categorie">
        <option value="">Choisir</option>
        <option value="1">Action</option>
        <option value="2">Comédie</option>
        <option value="3">Drame</option>
        <option value="4">Science-Fiction</option>
    </select><br><br>

    <label for="classification">Classification</label><br>
    <select id="classification" name="classification">
        <option value="">Choisir</option>
        <option value="Tout public">Tout public</option>
        <option value="12+">12+</option>
        <option value="16+">16+</option>
        <option value="18+">18+</option>
        <option value="Avertissement">Avertissement</option>
    </select><br><br>

    <input type="submit" value="Créer">
</form>

<br>
<button id="afficher" class="gros" type="button">Afficher les films</button>

<p id="msg"></p>
<div id="liste"></div>

<script src="film.js"></script>
</body>
</html>
