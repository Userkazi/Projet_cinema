<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="cinema.css">
    <title>Gestion des films</title>
</head>
<body>

<h1>Gestion des films</h1>

<form id="creerFilm">
    <label for="titre">Titre</label><br>
    <input id="titre" name="titre" type="text" required><br><br>

    <label for="resume">Résumé</label><br>
    <input id="resume" name="resume" type="text" required><br><br>

    <label for="duree">Durée</label><br>
    <input id="duree" name="duree" type="number" required><br><br>

    <input type="submit" value="Créer">
</form>

<br>
<button id="afficher" class="gros" type="button">Afficher les films</button>

<p id="msg"></p>
<div id="liste"></div>

<script src="film.js"></script>
</body>
</html>
