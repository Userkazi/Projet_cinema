<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Inscription Client</title></head>
<body>
    <h2>Créer un compte Client</h2>
    <form id="form-register">
        <input type="text" id="nom" placeholder="Votre nom" required>
        <input type="email" id="email" placeholder="Votre email" required>
        <input type="password" id="mot_de_passe" placeholder="Votre mot de passe" required>
        <button type="submit">S'inscrire</button>
    </form>

    <script>
        document.getElementById('form-register').addEventListener('submit', async (event) => {
            event.preventDefault();
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const mot_de_passe = document.getElementById('mot_de_passe').value;

            const reponse = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom: nom, email: email, mot_de_passe: mot_de_passe })
            });

            if (reponse.ok) {
                alert("Compte créé avec succès ! Connectez-vous.");
                window.location.href = '/login.html';
            } else {
                const data = await reponse.json();
                alert("Erreur : " + data.message);
            }
        });
    </script>
</body>
</html>
